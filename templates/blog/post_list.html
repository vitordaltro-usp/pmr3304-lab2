{% extends 'base.html' %}

{% block content %}
<h1>Últimas notícias</h1>

{% if post_list %}
<ul class="post-list">
    {% for post in post_list %}
    <li>
        <h2><a href="{% url 'blog:post_detail' post.pk %}">{{ post.title }}</a></h2>
        <div class="meta">{{ post.pub_date|date:"d/m/Y H:i" }}</div>
    </li>
    {% endfor %}
</ul>
{% else %}
<p>Nenhum post publicado ainda.</p>
{% endif %}

<p><a class="button" href="{% url 'blog:post_create' %}">Criar novo post</a></p>
{% endblock %}
